{% extends 'base.html' %}

{% block body %}

<div class="card shadow-sm">
  <div class="card-header">
    <h4 class="mb-0">Unlink assets from job schedule: {{job_schedule.summary}}</h4>
  </div>

  <div class="card-body">

    {% if assets %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        {% include "assets/asset_select_list.html" %}

        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-danger">Unlink Selected</button>
          <a href="{{url_for('job_schedules.assets', id=job_schedule.id)}}" class="btn btn-secondary">Back</a>
        </div>
      </form>
    {% else %}
      <p class="text-muted">No linked assets found.</p>
      <a href="{{url_for('job_schedules.assets', id=job_schedule.id)}}" class="btn btn-secondary">Back</a>
    {% endif %}

  </div>
</div>

{% endblock body %}
