{% extends 'base.html' %} {% block body %}

<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Confirm Delete</h4>
  </div>

  <div class="card-body">
    <p class="mb-4">
      Are you sure you want to delete <strong>{{job_schedule.work_required}}</strong>? Deleting
      this Job Schedule will stop creation of any future jobs and also delete any previous jobs - you might want to keep these for audit trail? 
    </p>

    <form method="post" id="delete-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    </form>

    <div class="d-flex gap-2">
      <button class="btn btn-danger" form="delete-form">Confirm Delete</button>
      <a href="{{url_for('job_schedules.view', id=job_schedule.id)}}" class="btn btn-secondary"
        >Back</a
      >
    </div>
  </div>
</div>

{% endblock body%}
