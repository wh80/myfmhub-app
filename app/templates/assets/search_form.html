{% from "_location_fields.html" import location_filters %}
<form method="get" class="mb-4">
  <div class="row g-2">
    <div class="col-md-6">
      <label for="search" class="form-label">Search</label>
      <input
        type="text"
        id="search"
        name="search"
        value="{{search}}"
        class="form-control"
        placeholder="Search description, asset number, serial number..."
      />
    </div>

    {{ location_filters(sites, buildings, zones, site_id, building_id, zone_id) }}

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> Search
      </button>
      <a href="{{url_for('assets.index')}}" class="btn btn-secondary w-100">
        <i class="bi bi-x-circle"></i> Cancel
      </a>
    </div>
  </div>
</form>
