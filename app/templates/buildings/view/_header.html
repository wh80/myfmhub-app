<div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Building: {{ building.name }}</h4>

    <div class="d-flex gap-2">
        {% if can('buildings.edit') %}
        <a href="{{ url_for('buildings.edit', id=building.id) }}" class="btn btn-primary btn-sm">Edit</a>
        {% endif %}

        {% if can('buildings.delete') %}
        <a href="{{ url_for('buildings.delete', id=building.id) }}" class="btn btn-danger btn-sm">Delete</a>
        {% endif %}
    </div>
</div>
