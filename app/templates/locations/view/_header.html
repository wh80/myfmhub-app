<div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Location: {{ location.materialised_path }}</h4>

    <div class="d-flex gap-2">
        {% if can('locations.create') %}
        <a
            href="{{ url_for('locations.create', parent_id=location.id) }}"
            class="btn btn-outline-primary btn-sm"
        >
            Add Sub-Location
        </a>
        {% endif %}

        {% if can('locations.edit') %}
        <a
            href="{{ url_for('locations.edit', id=location.id) }}"
            class="btn btn-primary btn-sm"
        >
            Edit
        </a>
        {% endif %}

        {% if can('locations.delete') %}
        <a
            href="{{ url_for('locations.delete', id=location.id) }}"
            class="btn btn-danger btn-sm"
        >
            Delete
        </a>
        {% endif %}
    </div>
</div>
