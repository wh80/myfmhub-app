{% extends 'base.html' %}
{% set title = 'Access denied' %} {% block body %}

<div class="card shadow-sm">
  <div class="card-header">
    <h4 class="mb-0"><i class="bi bi-shield-lock me-2" aria-hidden="true"></i>You don't have access to this page</h4>
  </div>

  <div class="card-body">
    <p class="mb-4">
      Your user group doesn't allow this. If you need access, ask an admin in your organisation to
      change your user group's permissions.
    </p>

    <div class="d-flex gap-2">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Go to dashboard</a>
      <button type="button" class="btn btn-secondary" onclick="history.back()">Back</button>
    </div>
  </div>
</div>

{% endblock body%}
