{% extends 'base.html' %}
{% set title = 'Page not found' %} {% block body %}

<div class="card shadow-sm">
  <div class="card-header">
    <h4 class="mb-0"><i class="bi bi-question-circle me-2" aria-hidden="true"></i>Page not found</h4>
  </div>

  <div class="card-body">
    <p class="mb-4">
      We couldn't find that page. It may have been deleted, or the link may be wrong.
    </p>

    <div class="d-flex gap-2">
      {% if g.user %}
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Go to dashboard</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Sign in</a>
      {% endif %}
      <button type="button" class="btn btn-secondary" onclick="history.back()">Back</button>
    </div>
  </div>
</div>

{% endblock body%}
