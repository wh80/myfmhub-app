{# search by email plus an organisation filter, for sessions and users #}
<form method="get" class="mb-4">
  <div class="row g-2">
    <div class="col-md-4">
      <label for="search" class="form-label">Search</label>
      <input type="text" id="search" name="search" value="{{search}}" class="form-control" placeholder="Email ..." />
    </div>

    <div class="col-md-4">
      <label for="organisation_id" class="form-label">Organisation</label>
      <select id="organisation_id" name="organisation_id" class="form-select">
        <option value="">All organisations</option>
        {% for organisation in organisations %}
        <option value="{{ organisation.id }}" {% if organisation_id == organisation.id|string %}selected{% endif %}>{{ organisation.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Search</button>
      <a href="{{url_for(request.endpoint)}}" class="btn btn-secondary w-100"><i class="bi bi-x-circle"></i> Cancel</a>
    </div>
  </div>
</form>
