<div class="card-header d-flex justify-content-between align-items-center">
  <h4 class="mb-0">Zone: {{ zone.name }}</h4>

  <div class="d-flex gap-2">
    {% if can('zones.edit') %}
    <a href="{{ url_for('zones.edit', id=zone.id) }}" class="btn btn-primary btn-sm">Edit</a>
    {% endif %}

    {% if can('zones.delete') %}
    <a href="{{ url_for('zones.delete', id=zone.id) }}" class="btn btn-danger btn-sm">Delete</a>
    {% endif %}
  </div>
</div>
