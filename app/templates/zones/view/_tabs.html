<ul class="nav nav-tabs mb-4">
    {% for tab, endpoint, label in [
        ('overview', 'zones.view', 'Overview'),
        ('assets', 'zones.assets', 'Assets'),
        ('jobs', 'zones.jobs', 'Jobs'),
        ('job_schedules', 'zones.job_schedules', 'Job Schedules'),
    ] %}
    <li class="nav-item">
        <a class="nav-link {% if active_tab == tab %}active{% endif %}" href="{{ url_for(endpoint, id=zone.id) }}">{{ label }}</a>
    </li>
    {% endfor %}

    {% if can('files.view') %}
    <li class="nav-item">
        <a
            class="nav-link {% if active_tab == 'files' %}active{% endif %}"
            href="{{ url_for('zones.files', id=zone.id) }}"
        >
            Files
        </a>
    </li>
    {% endif %}
</ul>
